name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,ml,demo]'
      - run: python -m pip check
      - run: python -m compileall -q beliefweave pwm demo benchmark scripts
      - run: python scripts/check_core_style.py
      - run: pytest --cov=pwm --cov=demo --cov-fail-under=90 -q

  release-contract:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,ml,demo]'
      - run: python scripts/check_core_style.py
      - run: PYTHONPATH=. python benchmark/evaluate_hard_scenarios.py
      - run: PYTHONPATH=. python benchmark/evaluate_retrieval.py
      - run: PYTHONPATH=. python benchmark/evaluate_calibration.py
      - run: PYTHONPATH=. python benchmark/authority_modelcheck.py
      - run: PYTHONPATH=. python benchmark/atomicity_fault_injection_eval.py
      - run: PYTHONPATH=. python benchmark/idempotency_privacy_migration_eval.py
      - run: python scripts/generate_experiment_lineage.py
      - run: python scripts/build_and_smoke_wheel.py
      - run: python scripts/validate_core_install.py
      - run: python scripts/audit_release.py
