[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beliefweave"
version = "0.17.0"
description = "Decision-aware belief revision and governed personalization for personal AI"
authors = [{name = "Aura Yavary"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pwm = "pwm.cli:main"
beliefweave = "pwm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "matplotlib>=3.8"]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pwm*", "beliefweave*"]

[tool.setuptools.package-data]
pwm = ["assets/*.joblib"]
beliefweave = ["py.typed"]
